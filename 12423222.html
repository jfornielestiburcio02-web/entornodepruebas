<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subir y Gestionar Imágenes - ImgBB + Firebase</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 20px auto;
      padding: 0 20px;
      background-color: #f4f6f9;
      color: #333;
    }
    h1, h2 {
      text-align: center;
    }
    .upload-box {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 30px;
      text-align: center;
    }
    input[type="file"] {
      margin: 10px 0;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }
    .card-body {
      padding: 10px;
      font-size: 12px;
    }
    .card-body p {
      margin: 5px 0;
      word-break: break-all;
    }
    .btn-delete {
      background-color: #dc3545;
      width: 100%;
      border-radius: 0 0 8px 8px;
    }
    .btn-delete:hover {
      background-color: #bd2130;
    }
    #status {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Galería de fotos</h1>

  <div class="upload-box">
    <h3>Subir nueva imagen</h3>
    <input type="file" id="imageInput" accept="image/*">
    <br>
    <button id="uploadBtn">Subir</button>
    <div id="status"></div>
  </div>

  <h2>Galería de Imágenes</h2>
  <div id="gallery" class="grid"></div>

  <!-- Carga de Firebase v10+ mediante CDN (ES Modules) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      deleteDoc, 
      doc,
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAPOnIq-VIhtZ_FWl3k-U2TFyTZgfCbwdE",
      authDomain: "semcatrpbot183617312.firebaseapp.com",
      projectId: "semcatrpbot183617312",
      storageBucket: "semcatrpbot183617312.firebasestorage.app",
      messagingSenderId: "1023153656437",
      appId: "1:1023153656437:web:ec2aa81dd1ca2889a6de3c"
    };

    // Inicializar Firebase y Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // API Key de ImgBB
    const IMGBB_API_KEY = "1c7ed8cdbecf0284bf614d4056bc5f29";

    // Lista de colecciones posibles para asignar de forma aleatoria
    const collectionsList = ["coleccion_a", "coleccion_b", "coleccion_c", "coleccion_d"];

    // Elementos del DOM
    const imageInput = document.getElementById("imageInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const statusDiv = document.getElementById("status");
    const galleryDiv = document.getElementById("gallery");

    // 1. Subir imagen a ImgBB y guardar referencia en Firestore
    uploadBtn.addEventListener("click", async () => {
      const file = imageInput.files[0];
      if (!file) {
        alert("Por favor, selecciona una imagen primero.");
        return;
      }

      statusDiv.style.color = "blue";
      statusDiv.textContent = "Subiendo";

      try {
        // Preparar FormData para la API de ImgBB
        const formData = new FormData();
        formData.append("image", file);

        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          statusDiv.textContent = "Guardando...";

          // Seleccionar una colección aleatoria
          const randomCollection = collectionsList[Math.floor(Math.random() * collectionsList.length)];

          // Estructura del documento
          const newImageData = {
            url: data.data.url,
            displayUrl: data.data.display_url,
            deleteUrl: data.data.delete_url,
            collectionName: randomCollection,
            createdAt: serverTimestamp()
          };

          // Guardar en Firestore
          await addDoc(collection(db, randomCollection), newImageData);

          statusDiv.style.color = "green";
          statusDiv.textContent = `¡Éxito!"`;
          imageInput.value = "";
        } else {
          throw new Error(data.error ? data.error.message : "Error al subir a ImgBB");
        }
      } catch (error) {
        console.error("Error:", error);
        statusDiv.style.color = "red";
        statusDiv.textContent = "Error al procesar la imagen: " + error.message;
      }
    });

    // 2. Escuchar cambios y leer imágenes de todas las colecciones
    function listenToAllCollections() {
      // Objeto local para almacenar los items cargados
      let allImages = {};

      collectionsList.forEach(collName => {
        onSnapshot(collection(db, collName), (snapshot) => {
          // Limpiar o actualizar imágenes de esta colección
          snapshot.docs.forEach(docSnap => {
            allImages[docSnap.id] = {
              id: docSnap.id,
              collection: collName,
              ...docSnap.data()
            };
          });

          // Detectar eliminados
          snapshot.docChanges().forEach(change => {
            if (change.type === "removed") {
              delete allImages[change.doc.id];
            }
          });

          renderGallery(allImages);
        });
      });
    }

    // Renderizar la galería visualmente
    function renderGallery(imagesObj) {
      galleryDiv.innerHTML = "";
      const imagesArray = Object.values(imagesObj);

      if (imagesArray.length === 0) {
        galleryDiv.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>No hay imágenes.</p>";
        return;
      }

      imagesArray.forEach(imgData => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${imgData.url}" alt="Imagen BD">
          <div class="card-body">
            <p><a href="${imgData.url}" target="_blank">Ver imagen en grande</a></p>
          </div>
          <button class="btn-delete" data-id="${imgData.id}" data-collection="${imgData.collection}">Eliminar foto</button>
        `;
        galleryDiv.appendChild(card);
      });

      // Añadir evento a los botones de eliminación
      document.querySelectorAll(".btn-delete").forEach(btn => {
        btn.onclick = async (e) => {
          const docId = e.target.getAttribute("data-id");
          const collName = e.target.getAttribute("data-collection");
          await deleteFromDatabase(collName, docId);
        };
      });
    }

    // 3. Eliminar únicamente el registro de Firestore (permanece en ImgBB)
    async function deleteFromDatabase(collName, docId) {
      if (confirm("¿Estás seguro de eliminar esta foto?")) {
        try {
          await deleteDoc(doc(db, collName, docId));
        } catch (error) {
          console.error("Error al eliminar:", error);
          alert("No se pudo eliminar el registro de Firestore.");
        }
      }
    }

    // Iniciar escucha al cargar la página
    listenToAllCollections();
  </script>
</body>
</html>
